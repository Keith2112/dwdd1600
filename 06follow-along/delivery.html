<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Keith Mecham">
    <meta name="description" content="Request a delivery from Drone Delivery.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Delivery | Request a Delivery</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <span class="site-name">Drone Delivery</span>
        <span class="tagline">Service Above and Beyond</span>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">About Us</a></li>
            <li><a class="active" href="delivery.html">Request a Delivery</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <main>
        <h1>Request a Delivery</h1>

        <form method="get" class="myForm" action="thanks.html">
            <fieldset>
                <legend>Customer Information</legend>
                <label>First Name* <input type="text" name="fName" required></label>
                <label>Last Name* <input type="text" name="lName" required></label>
                <label>Cell Number* <input type="tel" name="phone" placeholder="987-555-1234" required></label>
            </fieldset>

            <fieldset>
                <legend>Delivery Method</legend>
                <label><input type="radio" name="method" value="drone"> Drone Delivery, this takes two hours</label>
                <label><input type="radio" name="method" value="motorcycle"> Motorcycle Delivery, this takes four hours</label>
                <label><input type="radio" name="method" value="robot"> Robot Delivery, this takes six hours</label>
            </fieldset>

            <fieldset>
                <legend>Delivery Options</legend>
                <label><input type="checkbox" name="porch" value="chosen"> Front Porch</label>
                <label><input type="checkbox" name="deck" value="chosen"> Back Deck</label>
                <label><input type="checkbox" name="driveway" value="chosen"> Driveway</label>
                <label><input type="checkbox" name="garage" value="chosen"> Garage</label>

                <label>Preferred Delivery Time
                    <select name="time">
                        <option value="none">Please Select</option>
                        <option value="morning">Morning time is between 7 a.m. and 11 a.m.</option>
                        <option value="noon">Noon is between 11 a.m. and 2 p.m.</option>
                        <option value="afternoon">Afternoon is from 2 p.m. to 5 p.m.</option>
                        <option value="evening">Evening is anywhere from 5 p.m. to 8 p.m.</option>
                    </select>
                </label>
            </fieldset>

            <label>Comments
                <textarea name="comments"></textarea>
            </label>

            <input type="submit" value="Send Delivery Request">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Keith Mecham | <a href="mailto:keithrushmecham@gmail.com">Email Us</a></p>
    </footer>
</body>
</html>
